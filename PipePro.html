<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>PipePro — Steampunk Fabrication</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#A6CE39">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PipePro">
  <link rel="apple-touch-icon" href="icon-apple.png">
  <!-- iOS splash / startup images -->
  <link rel="apple-touch-startup-image" href="icon-512.png">
  <!-- Prevent iOS double-tap zoom -->
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body,#root{height:100%;background:#0A0B0D;overflow:hidden;color:#E8EDF2}
    /* iOS: 100vh overflows behind Safari bars — dvh tracks the real visible viewport */
    .shell{height:100vh;height:100dvh}
    .sheet86{max-height:86vh;max-height:86dvh}
    .sheet82{max-height:82vh;max-height:82dvh}
    button{cursor:pointer;border:none;background:none;font-family:inherit}
    input,select,textarea{outline:none;font-family:inherit}
    select{-webkit-appearance:none;appearance:none}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    input[type=number]{-moz-appearance:textfield}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#2A313A;border-radius:99px}
  </style>
</head>
<body>
<div id="root"></div>

<!-- Data layer -->
<script src="pipepro-data.js"></script>
<script src="pipepro-iso.js"></script>

<!-- React (production) — JSX is precompiled at deploy time by build.js; no in-browser Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js" crossorigin="anonymous"></script>

<!-- Component layers (compiled from the .jsx sources — edit .jsx, run: node build.js) -->
<script src="tweaks-panel.compiled.js"></script>
<script src="pipepro-valve.compiled.js"></script>
<script src="pipepro-tabs.compiled.js"></script>
<script src="pipepro-sheet.compiled.js"></script>
<script src="pipepro-draw.compiled.js"></script>
<script src="pipepro-shell.compiled.js"></script>



<!-- Service Worker registration -->
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js',{scope:'./'})
      .then(function(reg){
        console.log('[PipePro] SW registered, scope:',reg.scope);
      })
      .catch(function(err){
        console.log('[PipePro] SW registration failed:',err);
      });
  });
  // Self-heal after an update: reload once when the new SW takes control
  var swReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(swReloaded)return;swReloaded=true;location.reload();
  });
}
</script>
</body>
</html>
